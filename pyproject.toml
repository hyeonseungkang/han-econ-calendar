[project]
name = "han-econ-calendar"
version = "0.1.0"
description = "Fetch and convert Hankyung economic calendar data to per-nation ICS files"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "python-calamine>=0.8.2",
    "vobject>=0.9.9",
    "xlrd>=2.0.2",
]

[project.scripts]
fetch = "han_econ_calendar:fetch"
generate_ics = "han_econ_calendar:generate_ics"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]
